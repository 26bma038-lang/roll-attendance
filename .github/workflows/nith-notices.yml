# Copies academic and exam notices from nith.ac.in into Firestore (collegeFeed/nith), every 3 hours
# from 08:00 to 20:00 IST. Writes only when something changed. If a page fails, its old notices
# are kept and the run fails, so GitHub emails the repo owner.
#
# Secret: FIREBASE_SERVICE_ACCOUNT (the same one the Classroom sync uses).

name: NITH notices

on:
  schedule:
    - cron: "30 2-14/3 * * *" # 02:30, 05:30, 08:30, 11:30, 14:30 UTC = 08:00 … 20:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nith-notices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/nith-notices
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/nith-notices/package-lock.json

      - name: Check the secret is set
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT. See tools/nith-notices/README.md."
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - name: Sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run sync
